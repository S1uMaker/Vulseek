GoalThreatDirection:
  type: object
  description: Optional human threat direction used only as Craft context. Not a scan-job runtime input unless the UI supplies it. Focus and attackerModel are required; nonGoals and notes refine what must not be pursued.
  additionalProperties: false
  properties:
    focus:
      description: What to hunt for, in one concrete sentence. Name the asset, boundary, or vulnerability class. Do not list methods or tools.
      type: string
      minLength: 1
    attackerModel:
      description: Who the attacker is and what they may already control (network position, auth, local vs remote). Invalid capabilities belong in nonGoals, not here.
      type: string
      minLength: 1
    nonGoals:
      description: Explicit out-of-scope attacker powers, bug classes, or outcomes. Craft must merge these into GoalSpec.nonGoals.
      type: array
      items: { type: string }
    notes:
      description: Extra constraints, environment assumptions, or product context that is not itself a goal.
      type: string
  required: [focus, attackerModel]

GoalSpec:
  type: object
  description: Durable hunt contract after Craft self-red-team. Defines the outcome, not the method. Hunt and Surface read this file; it is not a shared /goal string. Every required field must be filled; empty strings are invalid.
  additionalProperties: false
  properties:
    goalId:
      description: Stable id for this GoalSpec in the scan job. Use a short slug such as goal-1. Do not reuse ids across rewritten specs in the same job.
      type: string
      minLength: 1
    title:
      description: Short human title of the hunt objective. One line, no method names, no file lists.
      type: string
      minLength: 1
    successCriteria:
      description: Testable definition of done. A candidate counts only if it meets this. Close lazy outs here after red-team (for example "a real attacker-controlled path to the sink", not "mentioned a sink").
      type: string
      minLength: 1
    nonGoals:
      description: Invalid attacker preconditions, out-of-scope classes, and outcomes that must not be counted as success. Include merged human nonGoals when present.
      type: array
      items:
        type: string
    attackerModel:
      description: Attacker capabilities and position that Judge will enforce. Theoretical paths that need powers outside this model must be rejected.
      type: string
      minLength: 1
    stopCondition:
      description: When a single Hunt task must stop. Always one candidate that meets successCriteria, or a justified exhaustion. Never "keep looking until time runs out".
      type: string
      minLength: 1
    persistenceLanguage:
      description: Instruction Hunt must treat as standing policy. Must include that "no bugs found" is intermediate, not success, and that the agent must change method before giving up.
      type: string
      minLength: 1
    redTeamClosedLoopholes:
      description: Lazy-agent loopholes Craft found (satisfy the letter without real work) and then closed in successCriteria or nonGoals. Each item names the loophole that was closed.
      type: array
      items:
        type: string
    surfaceGuidance:
      description: Optional planner notes for Surface (what a high-value surface looks like, suggested partition axes). Not a Hunt /goal and not a second success criterion.
      type: string
  required:
    - goalId
    - title
    - successCriteria
    - nonGoals
    - attackerModel
    - stopCondition
    - persistenceLanguage
    - redTeamClosedLoopholes
GoalCraftInput:
  type: object
  description: Craft stage input. Only the scan-job snapshot. No threatDirection.
  additionalProperties: false
  properties:
    scanJob:
      $ref: "#/schemas/ScanJobSnapshot"
  required:
    - scanJob
GoalCraftOutput:
  type: object
  description: Craft stage output. Write the GoalSpec JSON artifact and return only its path.
  additionalProperties: false
  properties:
    goalSpecPath:
      description: Container path of the written GoalSpec JSON artifact. Default /task/goal-spec.json.
      $pathOf: "#/schemas/GoalSpec"
  required:
    - goalSpecPath
HuntGoal:
  type: object
  description: One dispatchable hunt surface under the GoalSpec lens. Surface emits these; Hunt receives exactly one. Do not put a vulnerability finding here.
  additionalProperties: false
  properties:
    huntGoalId:
      description: Stable id for this hunt surface in the scan job. Unique among huntGoals emitted in this job. Example hg-auth-cookie-path.
      type: string
      minLength: 1
    title:
      description: Short name of the surface (module, flow, or boundary). Not a vulnerability title.
      type: string
      minLength: 1
    scopeStatement:
      description: One-sentence lockbox for this surface. Hunt must stay inside it. Not a second successCriteria; GoalSpec remains the outcome.
      type: string
      minLength: 1
    focusPaths:
      description: Repo-relative files or directories Hunt should stay inside. Empty array is allowed when the surface is not path-shaped.
      type: array
      items:
        type: string
    riskPathways:
      description: Suspected source-to-sink or trust-boundary crossings to investigate. Descriptive, not confirmed findings.
      type: array
      items:
        type: string
    rationale:
      description: Why this surface is high-value for the GoalSpec versus alternatives. Used by later Surface rounds to avoid repeating dead zones.
      type: string
  required:
    - huntGoalId
    - title
    - scopeStatement
    - focusPaths
SurfaceDispatch:
  type: object
  description: Surface planner output. First entry emits 2-8 diverse huntGoals. Later entries emit new huntGoals or declare global exhaustion. Surface does not hunt.
  additionalProperties: false
  properties:
    globalExhausted:
      description: True only when no useful unexplored GoalSpec-relevant surface remains. Then huntGoals must be []. False whenever this output dispatches one or more huntGoals.
      type: boolean
    exhaustionReason:
      description: Required when globalExhausted is true. Summarize covered partitions, dead zones, and why another slice would not help.
      type: string
    partitionDimension:
      description: Slice axis used for the huntGoals in this dispatch (module, data-flow, interface, ...). Helps later rounds pick a different axis.
      type: string
    huntGoals:
      description: Hunt surfaces to fan out this round. Empty if and only if globalExhausted is true. First round should be 2-8 diverse items; later rounds may emit fewer.
      type: array
      items:
        $ref: "#/schemas/HuntGoal"
  required:
    - globalExhausted
    - huntGoals
  if:
    properties:
      globalExhausted:
        const: true
    required:
      - globalExhausted
  then:
    required:
      - exhaustionReason
GoalCandidateFinding:
  type: object
  description: Exactly one vulnerability candidate from Hunt. Must meet GoalSpec.successCriteria. Not a theoretical note. Evidence must support claim. Never emit more than one per Hunt task.
  additionalProperties: false
  properties:
    candidateId:
      description: Stable id for this candidate. Unique in the scan job. Do not reuse an id from a discarded attempt.
      type: string
      minLength: 1
    huntGoalId:
      description: The huntGoalId of the assigned surface. Must match the Hunt task input.
      type: string
      minLength: 1
    title:
      description: One-line finding title. Name the bug, not the file. Example "Unauthenticated path traversal in backup restore".
      type: string
      minLength: 1
    description:
      description: What the bug is, how it manifests, and why it matters under the GoalSpec. Concrete. No filler.
      type: string
      minLength: 1
    vulnerabilityClass:
      description: Bug class label such as path-traversal, sqli, idor, rce, authz-bypass. Prefer a conventional name over a novel phrase.
      type: string
    location:
      description: Primary code location of the sink or violated check. filePath is required; line and symbol when known.
      type: object
      additionalProperties: false
      properties:
        filePath:
          description: Repo-relative path of the primary vulnerable file.
          type: string
          minLength: 1
        line:
          description: 1-based line of the sink or missing check. Null if the issue is file-wide and no single line is honest.
          type:
            - integer
            - "null"
        symbol:
          description: Function, method, or handler name at the location. Null if unknown.
          type:
            - string
            - "null"
      required:
        - filePath
    claim:
      description: Falsifiable statement Hunt is asserting. Example "attacker-controlled filename reaches fs.readFile without sanitization in restoreBackup". Judge tests this claim.
      type: string
      minLength: 1
    rootCauseKey:
      description: Stable key for the underlying mistake, used by Dedup and Surface to avoid re-hunting the same root cause. Prefer a short slug of missing-check plus location, not the candidateId.
      type: string
      minLength: 1
    evidence:
      description: Supporting observations. Each item is one fact (code, trace, or command result) that proves or bounds the claim.
      type: array
      items:
        type: string
    attackerControl:
      description: What the attacker actually controls to trigger the bug, consistent with GoalSpec.attackerModel.
      type: string
    preconditions:
      description: Required setup that is still allowed by the attacker model. Do not list disallowed powers; those make the candidate invalid.
      type: array
      items:
        type: string
    quickDisproofAttempt:
      description: How Hunt tried to kill the finding (wrong sink, sanitizer, auth gate). If disproof succeeded, do not emit this candidate.
      type: string
  required:
    - candidateId
    - huntGoalId
    - title
    - description
    - location
    - claim
    - rootCauseKey
GoalExhaustionDeclaration:
  type: object
  description: Hunt found no candidate that meets successCriteria after reasonable methods on this surface. "No bugs found" is not enough; methodsTried and coveredPaths must show real work.
  additionalProperties: false
  properties:
    huntGoalId:
      description: The assigned huntGoalId being declared exhausted. Must match Hunt input.
      type: string
      minLength: 1
    methodsTried:
      description: Distinct methods actually used (manual tracing, CodeQL query X, Semgrep rule Y, ...). Name what was run, not "various tools".
      type: array
      items:
        type: string
    coveredPaths:
      description: Repo-relative files or flows inspected. Used by Surface to treat these as dead zones for this GoalSpec.
      type: array
      items:
        type: string
    reason:
      description: Why this surface is exhausted under the GoalSpec. Mention remaining uncertainty only if it cannot be reduced with another reasonable method here.
      type: string
      minLength: 1
  required:
    - huntGoalId
    - methodsTried
    - coveredPaths
    - reason
GoalHuntOutput:
  type: object
  description: Hunt envelope payload. Fill exactly one of candidate or exhaustion; the unused field must be null. Envelope route is candidate or exhausted.
  additionalProperties: false
  properties:
    candidate:
      description: The single finding when this Hunt succeeds. Must be null when the surface is exhausted.
      anyOf:
        - $ref: "#/schemas/GoalCandidateFinding"
        - type: "null"
    exhaustion:
      description: Exhaustion record when the assigned surface is done with no qualifying finding. Must be null when emitting a candidate.
      anyOf:
        - $ref: "#/schemas/GoalExhaustionDeclaration"
        - type: "null"
  required:
    - candidate
    - exhaustion
GoalSurfaceInput:
  type: object
  description: Surface planner input. First entry has feedback null. Re-entry carries a mapped downstream event. GoalSpec is a file path, not an inline object.
  additionalProperties: false
  properties:
    goalSpecPath:
      description: Path of the GoalSpec JSON artifact written by Craft.
      $pathOf: "#/schemas/GoalSpec"
    repositoryPath:
      description: Path of the repository domain-object artifact when one exists. Optional until a producer writes it.
      $pathOf: "#/schemas/Repository"
    feedback:
      description: Null on first entry. Required on re-entry.
      anyOf:
        - $ref: "#/schemas/SurfaceFeedback"
        - type: "null"
  required:
    - goalSpecPath
    - feedback
GoalHuntInput:
  type: object
  description: Hunt stage input for one assigned surface. GoalSpec is a file path, not an inline object.
  additionalProperties: false
  properties:
    goalSpecPath:
      description: Path of the same GoalSpec JSON artifact Surface used.
      $pathOf: "#/schemas/GoalSpec"
    huntGoal:
      $ref: "#/schemas/HuntGoal"
    repositoryPath:
      description: Path of the repository domain-object artifact when one exists. Optional until a producer writes it.
      $pathOf: "#/schemas/Repository"
  required:
    - goalSpecPath
    - huntGoal
GoalJudgeVerdict:
  type: object
  description: Independent Judge decision on one candidate. Checks attack-path validity under GoalSpec.attackerModel and PoC feasibility as a clear contour. Do not invent fixes. Do not re-hunt.
  additionalProperties: false
  properties:
    candidateId:
      description: Candidate being judged. Must match the input candidate id.
      type: string
      minLength: 1
    decision:
      description: "confirmed only if the attack path is valid under the attacker model and a PoC contour is feasible. rejected if the path is theoretical, needs disallowed preconditions, or the claim fails. needs-more-evidence if more work could decide; current routing treats this as rejected."
      type: string
      enum: [confirmed, rejected, needs-more-evidence]
    summary:
      description: One-paragraph verdict. State why the path holds or fails. Do not repeat the whole candidate.
      type: string
      minLength: 1
    attackPathValid:
      description: True if source, sink, and missing check hold under GoalSpec.attackerModel. False if any required hop is missing or needs disallowed powers.
      type: boolean
    pocFeasible:
      description: True if a proof-of-concept contour is clear enough to reproduce (not necessarily a full exploit). False if the bug cannot be demonstrated even as a sketch.
      type: boolean
    reasons:
      description: Discrete supporting or rejecting reasons. Each item one fact. These are what Dedup and Surface will read.
      type: array
      items: { type: string }
  required: [candidateId, decision, summary, attackPathValid, pocFeasible, reasons]

GoalDedupResult:
  type: object
  description: Novelty check only. Do not re-judge whether the issue is a vulnerability. Compare against public issues/advisories when reachable and against prior findings in this scan job.
  additionalProperties: false
  properties:
    candidateId:
      description: Candidate being novelty-checked. Must match the input candidate id.
      type: string
      minLength: 1
    novelty:
      description: "novel if not seen before in this job or known public trackers. duplicate if it matches a prior finding or known report. known-fixed if public trackers show a fix. unknown if trackers were unreachable and no local match exists."
      type: string
      enum: [novel, duplicate, known-fixed, unknown]
    summary:
      description: Why this novelty label. Cite issue/PR/advisory ids or the prior finding when relevant.
      type: string
      minLength: 1
    references:
      description: URLs or ids of matching issues, PRs, advisories, or prior findings. Empty array when none apply.
      type: array
      items: { type: string }
    judgePath:
      description: When novelty is novel, preserve the unchanged input.judge object as a JSON artifact and set this to its path. For every other novelty value, do not write the file and set this to null.
      type: [string, "null"]
  required: [candidateId, novelty, summary, references, judgePath]

SurfaceFeedback:
  type: object
  description: Downstream event fed back into Surface on re-entry. Surface uses this to avoid dead zones and already-novel root causes. Hunt and Judge do not produce this object directly; the runner maps their outputs into it.
  additionalProperties: false
  properties:
    kind:
      description: "Which event this is. hunt-exhausted a surface declared done. judge-reject Judge did not confirm. dedup-reject not novel. dedup-novel confirmed and novel."
      type: string
      enum:
        - hunt-exhausted
        - judge-reject
        - dedup-reject
        - dedup-novel
    huntGoalId:
      description: Hunt surface this event belongs to, when known.
      type: string
    candidateId:
      description: Candidate id when this event is about a finding. Null for hunt-exhausted.
      type:
        - string
        - "null"
    summary:
      description: Short fact Surface should remember (why rejected, what was covered, which rootCauseKey is now novel).
      type: string
    payload:
      description: Structured facts for the planner. Only these keys are allowed.
      type: object
      additionalProperties: false
      properties:
        rootCauseKey:
          type: string
        coveredPaths:
          type: array
          items:
            type: string
        methodsTried:
          type: array
          items:
            type: string
  required:
    - kind
    - summary
