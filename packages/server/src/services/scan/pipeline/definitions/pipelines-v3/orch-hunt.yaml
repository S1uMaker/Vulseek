version: 3
name: orchestrator-hunt-programmatic
supportedTargets:
  - project
  - evaluation
root: orchestrator
limits:
  maxTasks: 10000
  maxDurationSeconds: 86400
presentation:
  jobTabs:
    - id: candidates
      label: Candidates
      renderer: candidate-results
      dataSource: vulnerability-candidates
      columns:
        - title
        - filePath
        - analysisResult
        - verificationResult
        - triageResult
        - score
        - createdAt
      filters:
        - analysisResult
        - verificationResult
        - triageResult
      defaultSort:
        field: createdAt
        direction: desc
      detail: vulnerability-candidate
schemas:
  evidence:
    type: object
    required:
      - id
      - kind
      - summary
      - filePath
      - line
      - symbol
      - command
      - artifactPath
      - observation
      - supports
      - contradicts
      - confidenceImpact
    additionalProperties: false
    properties:
      id:
        type: string
      kind:
        enum: [code, runtime, fuzz, negative, assumption, external]
      summary:
        type: string
      filePath:
        type: [string, "null"]
      line:
        type: [integer, "null"]
      symbol:
        type: [string, "null"]
      command:
        type: [string, "null"]
      artifactPath:
        type: [string, "null"]
      observation:
        type: [string, "null"]
      supports:
        type: array
        items:
          type: string
      contradicts:
        type: array
        items:
          type: string
      confidenceImpact:
        type: [string, "null"]
  repository:
    type: object
    required:
      - id
      - name
      - summary
      - languages
      - buildSystems
      - runtimeDirectories
      - downrankedDirectories
      - notes
      - targetRef
      - targetTag
      - commitSha
      - baseSha
      - commitWindow
    properties:
      id:
        type: string
      name:
        type: string
      summary:
        type: string
      languages:
        type: array
        items:
          type: string
      buildSystems:
        type: array
        items:
          type: string
      runtimeDirectories:
        type: array
        items:
          type: string
      downrankedDirectories:
        type: array
        items:
          type: string
      notes:
        type: array
        items:
          type: string
      targetRef:
        type: [string, "null"]
      targetTag:
        type: [string, "null"]
      commitSha:
        type: [string, "null"]
      baseSha:
        type: [string, "null"]
      commitWindow:
        type: integer
  target-kind:
    enum:
      - function
      - route-handler
      - middleware
      - api-route
      - server-action
      - page-loader
      - controller-action
      - view-function
      - resolver
      - job-handler
      - cli-command
      - security-config
      - template-render
      - parser-deserializer
      - data-access
      - unknown
  candidate:
    type: object
    required:
      - id
      - functionId
      - title
      - description
      - filePath
      - line
      - vulnerabilityType
      - confidence
      - score
      - claim
      - rootCauseKey
      - evidence
      - attackerControl
      - affectedSink
      - preconditions
      - quickDisproofAttempt
      - needsFuzzing
      - needsManualAnalysis
    properties:
      id:
        type: string
      functionId:
        type: [string, "null"]
      title:
        type: string
      description:
        type: string
      filePath:
        type: [string, "null"]
      line:
        type: [integer, "null"]
      vulnerabilityType:
        type: [string, "null"]
      confidence:
        type: [number, "null"]
      score:
        type: [number, "null"]
      claim:
        type: string
      rootCauseKey:
        type: [string, "null"]
      targetId:
        type: [string, "null"]
      targetKind:
        anyOf:
          - $ref: "#/schemas/target-kind"
          - type: "null"
      evidence:
        type: array
        items:
          $ref: "#/schemas/evidence"
      attackerControl:
        type: [string, "null"]
      affectedSink:
        type: [string, "null"]
      preconditions:
        type: array
        items:
          type: string
      quickDisproofAttempt:
        type: [string, "null"]
      needsFuzzing:
        type: boolean
      needsManualAnalysis:
        type: boolean
  verification:
    type: object
    required:
      - id
      - result
      - summary
      - confidence
      - score
      - reportPath
      - runtimeSeconds
      - evidenceBundle
      - residualUncertainty
    properties:
      id:
        type: string
      result:
        enum: ["true", likely, "false"]
      summary:
        type: string
      confidence:
        type: [number, "null"]
      score:
        type: [number, "null"]
      reportPath:
        type: [string, "null"]
      runtimeSeconds:
        type: [number, "null"]
      evidenceBundle:
        type: array
        items:
          $ref: "#/schemas/evidence"
      residualUncertainty:
        type: array
        items:
          type: string
  triage:
    type: object
    required:
      - id
      - result
      - disqualifier
      - disqualifierReason
      - securityClassification
      - isSecurityIssue
      - impactType
      - cvssVector
      - cvssScore
      - cvssSeverity
      - exploitability
      - isExploitable
      - commonTriggerConditions
      - hardeningOrRobustness
      - epssProbability30d
      - epssSource
      - summary
      - reportPath
      - runtimeSeconds
      - evidenceBundle
      - residualUncertainty
    properties:
      id:
        type: string
      result:
        enum: [security_issue, non_security, hardening, needs_review]
      disqualifier:
        enum:
          - D-0
          - D-1
          - D-1.5
          - D-2
          - D-3
          - D-4
          - D-5
          - null
      disqualifierReason:
        type: [string, "null"]
      securityClassification:
        enum: [vulnerability, security_hardening, robustness, non_security, unknown]
      isSecurityIssue:
        type: boolean
      impactType:
        type: string
      cvssVector:
        type: [string, "null"]
      cvssScore:
        type: [number, "null"]
        minimum: 0
        maximum: 10
      cvssSeverity:
        enum: [none, low, medium, high, critical, unknown]
      exploitability:
        enum: [none, theoretical, proof_of_concept, practical, unknown]
      isExploitable:
        type: [boolean, "null"]
      commonTriggerConditions:
        type: array
        items:
          type: string
      hardeningOrRobustness:
        type: boolean
      epssProbability30d:
        type: [number, "null"]
        minimum: 0
        maximum: 1
      epssSource:
        type: string
      summary:
        type: string
      reportPath:
        type: [string, "null"]
      runtimeSeconds:
        type: [number, "null"]
      evidenceBundle:
        type: array
        items:
          $ref: "#/schemas/evidence"
      residualUncertainty:
        type: array
        items:
          type: string
  hunt-task:
    type: object
    additionalProperties: false
    required:
      - name
      - goalPrompt
    properties:
      name:
        type: string
        minLength: 1
        pattern: "^#[1-9][0-9]* .+"
        description: >-
          Job-global hunt id assigned by the Orchestrator. Must start with a
          monotonically increasing #<n> prefix and a space, then a short slug
          (example: "#1 rest-authz-boundary"). n starts at 1 for the first hunt
          in the job and increases by 1 for every later huntTasks item across
          all turns. Never skip, reuse, or renumber. Hunter must echo this
          string exactly.
      goalPrompt:
        type: string
        minLength: 1
        description: >-
          Lock one falsifiable primitive. Outcome-heavy and path-light: what
          must be proved, what is excluded, and that this hunt stops after the
          primitive (a missing unauthenticated entry may be the gap). Do not
          prefix with /goal, do not write the hunter submit footer, do not say
          "audit all", and do not ask the hunter to find a full RCE.
stages:
  orchestrator:
    name: Orchestrator
    description: >-
      Slice the repository by primitive, keep a ledger, dispatch huntTasks,
      compose chains, and submit candidates only when entry → primitive(s) →
      sink → impact is complete.
    role: scan
    group: orch-hunt
    concurrency: 1
    maxConcurrency: 1
    disableable: false
    goal: true
    goalPreserving: true
    runtime:
      kind: agent
      goalSession: shared
      persistent: true
      reuseContainer: true
      nullableOutput: false
      cwd: /workspace/repo
      inputDelivery: poll
      messageNotification: true
      skills:
        - scan-runtime
        - orchestrator
      mcp:
        - securitycontext
      outputSuffix: omit
      pollPrompt: |
        Inbound hunter notify means take get_hunter_feedback now. If availableSlots > 0, spawn_hunters. An empty result is not a hang.
      prompt: |
        You are the Orchestrator for a high-severity vulnerability research scan. You dispatch Hunters; you are not a Hunter. Do not chase a single sink file yourself. Follow $VULSEEK_AGENT_HOME/skills/orchestrator/SKILL.md.

        Slice work by primitive (sink, gate, smuggle/desync, privilege upgrade). The first wave must not send every hunter after unauthenticated RCE. Each hunter goalPrompt locks one falsifiable primitive: outcome-heavy and path-light. Do not prefix goalPrompt with /goal and do not write the hunter submit footer.

        Use Security Context MCP to slice primitives from past fixes and current-tree variant leads. A known CVE is a map, not a candidate, unless the chain is still live in this tree. Do not idle-wait for context builds while hunter slots are open.

        When inbound hunter feedback or a notify arrives, take it with get_hunter_feedback, record the primitive in the /lane ledger, open a connector hunt for any remaining gap, and call submit_candidate only when entry → primitive(s) → sink → impact is evidenced at file:line. A sink that exists but is gated is an asset, not a candidate.

        If availableSlots > 0, spawn_hunters immediately to fill slots, then read locally. Local reads are only to write the next primitive briefs or to check a submitted chain. Do not idle-wait and do not deep-dive while slots are open.

        Job success is an original unauthenticated high-CVSS chain (remote RCE or equivalent). Not finding a complete RCE is not a stop condition and is not a Hunter success condition. Do not write exploit PoCs. Do not run a full admin-create / write-file exploit chain.
      prepareRepository: target
      includePolicy: true
      plugins: []
    outputSchema:
      type: object
      additionalProperties: false
      properties:
        huntTasks:
          type: array
          items:
            $ref: "#/schemas/hunt-task"
        candidates:
          type: array
          items:
            $ref: "#/schemas/candidate"
      required:
        - huntTasks
        - candidates
    inputArtifacts: []
    outputArtifacts: []
    effects:
      - type: sync-candidates
    taskName: Orchestrate hunts
    containerNameParts: []
    allowAgentExit: true
    promptValues: {}
  hunter:
    name: Hunter
    description: >-
      Nail one falsifiable primitive and report the gap. Returns name +
      feedback. Hunter does not submit candidates or declare exhaustion.
    role: scan
    group: orch-hunt
    concurrency: 8
    maxConcurrency: 8
    disableable: false
    goal: true
    runtime:
      kind: agent
      goalSession: per-task
      persistent: false
      reuseContainer: true
      cwd: /workspace/repo
      inputDelivery: prompt
      skills:
        - codeql
        - semgrep
        - tree-sitter
      mcp:
        - securitycontext
      prompt: |
        {{goalPrompt}}

        Assigned hunt name: {{name}}
        When submitting Message, set name to this exact assigned hunt name (including the #<n> prefix) and put the research result in feedback.

        Standing Hunt rules:
        - This /goal stays active until this assigned primitive has evidence, including negative evidence such as a blocking gate at file:line. Do not prove a full unauthenticated RCE.
        - Stay on the same primitive and change method at least once (for example manual source-to-sink plus Semgrep or CodeQL, or a sibling API).
        - Do not emit a speculative RCE just to finish. Do not submit_candidate. Do not declare exhaustion. Do not write a PoC. Do not run a full admin-create / write-file exploit chain.
        - feedback must be short markdown with these blocks: primitive type (sink / gate / smuggle-or-desync / privilege-upgrade), location (file:line + symbol), proved (one or more facts), gap (which primitive is still needed to reach an unauthenticated entry or the impact).
      prepareRepository: target
      includePolicy: false
      plugins: []
    outputSchema:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          pattern: "^#[1-9][0-9]* .+"
          description: >-
            Exact hunt id assigned by the Orchestrator, including the job-global
            #<n> prefix (example: "#1 rest-authz-boundary"). Do not invent or
            rewrite this string.
        feedback:
          type: string
          minLength: 1
          description: >-
            Short markdown research result. Must include primitive type
            (sink / gate / smuggle-or-desync / privilege-upgrade), location
            (file:line + symbol), proved facts, and the remaining gap. Do not
            declare exhaustion.
      required:
        - name
        - feedback
    inputArtifacts: []
    outputArtifacts: []
    effects: []
    taskName: $input.name
    containerNameParts: []
    allowAgentExit: false
    promptValues:
      name: $input.name
      goalPrompt: $input.goalPrompt
  verify-finding:
    name: Verify Finding
    description: Fact-check a candidate's paths, claims, and evidence.
    role: verification
    group: review
    concurrency: 1
    disableable: true
    runtime:
      kind: agent
      persistent: false
      reuseContainer: true
      nullableOutput: false
      cwd: /workspace/repo
      skills:
        - verify-finding
      prompt: |
        You are the sanity-check verifier agent for one candidate.
        {{taskIsolation}}
        Work only on this candidate and validate its factual basis.
        scan_job_id: {{scanJobId}}
        candidate_id: {{candidateId}}
        candidate_title: {{candidateTitle}}
        candidate_description: {{candidateDescription}}
        candidate_file: {{candidateFile}}
        candidate_line: {{candidateLine}}
        repository_json_path: {{repositoryJsonPath}}
        candidate_json_path: {{candidateJsonPath}}
        task_dir: {{taskDir}}
        write_verify_report_to: {{reportPath}}

        Use the installed skill named verify-finding as your working method.
        The verify-finding skill file is $VULSEEK_AGENT_HOME/skills/verify-finding/SKILL.md.
        Read the repository and candidate JSON files referenced above before verification.
        Do not repeat broad exploration. This stage is a sanity check only.
        Check whether the candidate's factual claims, code paths, symbols, data-flow descriptions, evidence, and trigger/precondition descriptions really exist or basically hold in the repository.
        Do not judge security impact, exploitability, CVSS, EPSS, whether this is a bug, or whether it should be reported as a vulnerability. Those decisions belong to triage.
        Write a concise markdown sanity-check report to write_verify_report_to.
        Write every task artifact only under task_dir.
        Set id to {{taskId}}.
        Set reportPath to {{reportPath}}.
        Set runtimeSeconds to null if unknown.
        Set status to completed when the run succeeds.
        Set result to the JSON string "true", "likely", or "false".
        Do not return boolean true/false.
        Use result exactly as:
        - "true": core facts, paths, code locations, and trigger conditions are present and materially support the analysis.
        - "likely": most core facts hold, but some uncertainty remains that does not clearly refute the analysis.
        - "false": a central factual claim, code path, trigger, or precondition is absent or contradicted.
      prepareRepository: none
      includePolicy: false
      plugins: []
    outputSchema:
      $ref: "#/schemas/verification"
    inputArtifacts: []
    outputArtifacts: []
    effects:
      - type: project-candidate-result
        resultStage: verify
    report:
      path: /task/01_verify_report.md
      required: true
    taskName: "Candidate Verification: $input.candidate.title"
    containerNameParts: []
    allowAgentExit: false
    promptValues:
      scanJobId: $ctx.scanJobId
      candidateId: $input.candidate.id
      candidateTitle: $input.candidate.title
      candidateDescription: $input.candidate.description
      candidateFile: $input.candidate.filePath
      candidateLine: $input.candidate.line
      repositoryJsonPath: /task/inputs/repository.json
      candidateJsonPath: /task/inputs/candidate.json
      taskDir: $ctx.taskDir
      reportPath: /task/01_verify_report.md
      taskId: $ctx.taskId
  triage-finding:
    name: Triage Finding
    description: Classify the security impact of a verified candidate.
    role: verification
    group: review
    concurrency: 1
    disableable: true
    runtime:
      kind: agent
      persistent: false
      reuseContainer: true
      nullableOutput: false
      cwd: /workspace/repo
      skills:
        - triage-finding
      prompt: |
        You are the triage agent for one verified candidate.
        {{taskIsolation}}
        Work only on this candidate and classify security impact after factual verification passed.
        Use the installed skill named triage-finding as your working method.
        The triage-finding skill file is $VULSEEK_AGENT_HOME/skills/triage-finding/SKILL.md.
        scan_job_id: {{scanJobId}}
        candidate_id: {{candidateId}}
        candidate_title: {{candidateTitle}}
        candidate_description: {{candidateDescription}}
        candidate_file: {{candidateFile}}
        candidate_line: {{candidateLine}}
        verify_result: {{verifyResult}}
        verify_summary: {{verifySummary}}
        repository_json_path: {{repositoryJsonPath}}
        candidate_json_path: {{candidateJsonPath}}
        verify_result_json_path: {{verifyResultJsonPath}}
        task_dir: {{taskDir}}
        write_triage_report_to: {{reportPath}}

        Read the JSON files referenced above before triage.
        Use verify only as a factual sanity-check input. Do not reinterpret verify as a security verdict.
        Classify whether the sanity-checked facts amount to a security issue, non-security bug, hardening finding, or unresolved review item.
        Evaluate disqualifiers before assigning the final security classification. Set disqualifier to null and disqualifierReason to null when no disqualifier applies. If a disqualifier applies, set disqualifierReason to the concrete evidence-based reason.
        - D-0: the vulnerability hypothesis is disproven by code, runtime evidence, or verification facts.
        - D-1: the affected path is only test, mock, example, fixture, sample, benchmark, or dead code.
        - D-1.5: privilege tautology; exploitation already requires the exact privilege or authority that the alleged impact would grant.
        - D-2: required preconditions are unrealistic, contradictory to supported deployments, or require attacker powers outside the threat model.
        - D-3: the claim depends on hedging language or unverifiable speculation that cannot be validated from available evidence.
        - D-4: the behavior has no security impact; it may be a normal bug, robustness issue, or quality issue only.
        - D-5: API misuse or violation of an explicit code/API contract causes the finding; use this for contract errors that should be tracked but are not a confirmed vulnerability by themselves. Do not use D-5 to dismiss a contract violation that produces attacker-controllable security impact.
        When a disqualifier applies, keep result, securityClassification, CVSS, and exploitability consistent with that disqualification.
        Assess CVSS, exploitability, common trigger conditions, and whether this is security impact versus robustness/hardening.
        For EPSS, prefer an official CVE/EPSS mapping when the candidate clearly maps to a CVE. If no CVE maps, provide a heuristic 30-day probability estimate and set epssSource to describe that fallback.
        Write a concise markdown triage report to write_triage_report_to, including the selected disqualifier and disqualifierReason when present.
        Write every task artifact only under task_dir.
        Set id to {{taskId}}.
        Set reportPath to {{reportPath}}.
        Set runtimeSeconds to null if unknown.
        Set status to completed when the run succeeds.
      prepareRepository: none
      includePolicy: false
      plugins: []
    outputSchema:
      $ref: "#/schemas/triage"
    inputArtifacts: []
    outputArtifacts: []
    effects:
      - type: project-candidate-result
        resultStage: triage
    report:
      path: /task/01_triage_report.md
      required: true
    taskName: "Candidate Triage: $input.candidate.title"
    containerNameParts: []
    allowAgentExit: false
    promptValues:
      scanJobId: $ctx.scanJobId
      candidateId: $input.candidate.id
      candidateTitle: $input.candidate.title
      candidateDescription: $input.candidate.description
      candidateFile: $input.candidate.filePath
      candidateLine: $input.candidate.line
      verifyResult: $file($input.verifyResultPath).result
      verifySummary: $file($input.verifyResultPath).summary
      repositoryJsonPath: /task/inputs/repository.json
      candidateJsonPath: /task/inputs/candidate.json
      verifyResultJsonPath: $input.verifyResultPath
      taskDir: $ctx.taskDir
      reportPath: /task/01_triage_report.md
      taskId: $ctx.taskId
edges:
  - id: orchestrator-to-hunter
    name: orchestrator-to-hunter
    from: orchestrator
    to: hunter
    fork: false
    mode: fanOut
    foreach: $.huntTasks[*]
    input:
      name: $item.name
      goalPrompt: $item.goalPrompt
  - id: hunter-to-orchestrator
    name: hunter-to-orchestrator
    from: hunter
    to: orchestrator
    fork: false
    mode: map
    input:
      name: $output.name
      feedback: $output.feedback
  - id: orchestrator-to-verify-finding
    name: orchestrator-to-verify-finding
    from: orchestrator
    to: verify-finding
    fork: false
    mode: fanOut
    foreach: $.candidates[*]
    input:
      candidate: $item
      repositoryPath: $input.repositoryPath
    artifacts:
      - from: $input.repositoryPath
        to: inputs/repository.json
        required: true
      - from: $input.candidate
        to: inputs/candidate.json
        required: true
  - id: verify-finding-to-triage-finding
    name: verify-finding-to-triage-finding
    from: verify-finding
    to: triage-finding
    fork: false
    mode: map
    input:
      candidate: $input.candidate
      repositoryPath: $input.repositoryPath
      verifyResultPath: /task/inputs/verification.json
    artifacts:
      - from: $input.repositoryPath
        to: inputs/repository.json
        required: true
      - from: $input.candidate
        to: inputs/candidate.json
        required: true
      - from: $output
        to: inputs/verification.json
        required: true
    outputSchema:
      $ref: "#/schemas/verification"
groups: []
