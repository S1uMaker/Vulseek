version: 3
name: orchestrator-hunt-programmatic
supportedTargets:
  - project
  - evaluation
root: orchestrator
limits:
  maxTasks: 10000
  maxDurationSeconds: 86400
presentation:
  jobTabs:
    - id: candidates
      label: Candidates
      renderer: candidate-results
      dataSource: vulnerability-candidates
      columns:
        - title
        - filePath
        - analysisResult
        - verificationResult
        - triageResult
        - score
        - createdAt
      filters:
        - analysisResult
        - verificationResult
        - triageResult
      defaultSort:
        field: createdAt
        direction: desc
      detail: vulnerability-candidate
schemas:
  evidence:
    type: object
    required:
      - id
      - kind
      - summary
      - filePath
      - line
      - symbol
      - command
      - artifactPath
      - observation
      - supports
      - contradicts
      - confidenceImpact
    additionalProperties: false
    properties:
      id:
        type: string
      kind:
        enum: [code, runtime, fuzz, negative, assumption, external]
      summary:
        type: string
      filePath:
        type: [string, "null"]
      line:
        type: [integer, "null"]
      symbol:
        type: [string, "null"]
      command:
        type: [string, "null"]
      artifactPath:
        type: [string, "null"]
      observation:
        type: [string, "null"]
      supports:
        type: array
        items:
          type: string
      contradicts:
        type: array
        items:
          type: string
      confidenceImpact:
        type: [string, "null"]
  repository:
    type: object
    required:
      - id
      - name
      - summary
      - languages
      - buildSystems
      - runtimeDirectories
      - downrankedDirectories
      - notes
      - targetRef
      - targetTag
      - commitSha
      - baseSha
      - commitWindow
    properties:
      id:
        type: string
      name:
        type: string
      summary:
        type: string
      languages:
        type: array
        items:
          type: string
      buildSystems:
        type: array
        items:
          type: string
      runtimeDirectories:
        type: array
        items:
          type: string
      downrankedDirectories:
        type: array
        items:
          type: string
      notes:
        type: array
        items:
          type: string
      targetRef:
        type: [string, "null"]
      targetTag:
        type: [string, "null"]
      commitSha:
        type: [string, "null"]
      baseSha:
        type: [string, "null"]
      commitWindow:
        type: integer
  target-kind:
    enum:
      - function
      - route-handler
      - middleware
      - api-route
      - server-action
      - page-loader
      - controller-action
      - view-function
      - resolver
      - job-handler
      - cli-command
      - security-config
      - template-render
      - parser-deserializer
      - data-access
      - unknown
  candidate:
    type: object
    required:
      - id
      - functionId
      - title
      - description
      - filePath
      - line
      - vulnerabilityType
      - confidence
      - score
      - claim
      - rootCauseKey
      - evidence
      - attackerControl
      - affectedSink
      - preconditions
      - quickDisproofAttempt
      - needsFuzzing
      - needsManualAnalysis
    properties:
      id:
        type: string
      functionId:
        type: [string, "null"]
      title:
        type: string
      description:
        type: string
      filePath:
        type: [string, "null"]
      line:
        type: [integer, "null"]
      vulnerabilityType:
        type: [string, "null"]
      confidence:
        type: [number, "null"]
      score:
        type: [number, "null"]
      claim:
        type: string
      rootCauseKey:
        type: [string, "null"]
      targetId:
        type: [string, "null"]
      targetKind:
        anyOf:
          - $ref: "#/schemas/target-kind"
          - type: "null"
      evidence:
        type: array
        items:
          $ref: "#/schemas/evidence"
      attackerControl:
        type: [string, "null"]
      affectedSink:
        type: [string, "null"]
      preconditions:
        type: array
        items:
          type: string
      quickDisproofAttempt:
        type: [string, "null"]
      needsFuzzing:
        type: boolean
      needsManualAnalysis:
        type: boolean
  verification:
    type: object
    required:
      - id
      - result
      - summary
      - confidence
      - score
      - reportPath
      - runtimeSeconds
      - evidenceBundle
      - residualUncertainty
    properties:
      id:
        type: string
      result:
        enum: ["true", likely, "false"]
      summary:
        type: string
      confidence:
        type: [number, "null"]
      score:
        type: [number, "null"]
      reportPath:
        type: [string, "null"]
      runtimeSeconds:
        type: [number, "null"]
      evidenceBundle:
        type: array
        items:
          $ref: "#/schemas/evidence"
      residualUncertainty:
        type: array
        items:
          type: string
  triage:
    type: object
    required:
      - id
      - result
      - disqualifier
      - disqualifierReason
      - securityClassification
      - isSecurityIssue
      - impactType
      - cvssVector
      - cvssScore
      - cvssSeverity
      - exploitability
      - isExploitable
      - commonTriggerConditions
      - hardeningOrRobustness
      - epssProbability30d
      - epssSource
      - summary
      - reportPath
      - runtimeSeconds
      - evidenceBundle
      - residualUncertainty
    properties:
      id:
        type: string
      result:
        enum: [security_issue, non_security, hardening, needs_review]
      disqualifier:
        enum:
          - D-0
          - D-1
          - D-1.5
          - D-2
          - D-3
          - D-4
          - D-5
          - null
      disqualifierReason:
        type: [string, "null"]
      securityClassification:
        enum: [vulnerability, security_hardening, robustness, non_security, unknown]
      isSecurityIssue:
        type: boolean
      impactType:
        type: string
      cvssVector:
        type: [string, "null"]
      cvssScore:
        type: [number, "null"]
        minimum: 0
        maximum: 10
      cvssSeverity:
        enum: [none, low, medium, high, critical, unknown]
      exploitability:
        enum: [none, theoretical, proof_of_concept, practical, unknown]
      isExploitable:
        type: [boolean, "null"]
      commonTriggerConditions:
        type: array
        items:
          type: string
      hardeningOrRobustness:
        type: boolean
      epssProbability30d:
        type: [number, "null"]
        minimum: 0
        maximum: 1
      epssSource:
        type: string
      summary:
        type: string
      reportPath:
        type: [string, "null"]
      runtimeSeconds:
        type: [number, "null"]
      evidenceBundle:
        type: array
        items:
          $ref: "#/schemas/evidence"
      residualUncertainty:
        type: array
        items:
          type: string
stages:
  orchestrator:
    name: Orchestrator
    description: Manage research coverage, dispatch huntTasks, and accept candidates for verification.
    role: scan
    group: orch-hunt
    concurrency: 1
    maxConcurrency: 1
    disableable: false
    goal: true
    goalPreserving: true
    runtime:
      kind: agent
      goalSession: shared
      persistent: true
      reuseContainer: true
      nullableOutput: false
      cwd: /workspace/repo
      skills:
        - scan-runtime
      prompt: |
        You are the Orchestrator for a high-severity vulnerability research scan. Coordinate Hunters by dispatching huntTasks. Do not perform the detailed hunt yourself and do not write exploit PoCs.

        Discover high-impact vulnerabilities from first principles in a typical production deployment of this repository. Prefer realistic low-privilege or unauthenticated entry points and high-impact outcomes, but keep searching after any one finding. Choose the relevant security properties, impact classes, attack surfaces, and research strategy yourself. Combine findings when a chain is required, including intermediate bugs such as authentication or authorization bypasses, but do not promote a chain without independently establishing every link and its attacker-controlled data flow. Finding one chain is not a stopping condition.

        Work from first principles using the repository and available third_party source. Do not use changelogs, git history, release notes, internet searches, or patched-version diffs to infer a result. Dependency source may be inspected locally when needed. Do not claim a vulnerability from a suspicious line alone: establish the entry point, trust-boundary crossing, attacker control, relevant sink, required preconditions, impact, and a concrete disproof attempt.

        The only way to parallelize investigation is to dispatch huntTasks.

        Read /task/inputs/repository.json when present. Keep any Orchestrator working files you create under /lane/ and read them only when needed for the current task. Do not scan /lane/ as a source of Hunter task results. /lane is stable across orchestrator turns; /task is not. Write /task/output.json once per turn, validate it, then mark the thread goal complete.

        Read $VULSEEK_AGENT_HOME/skills/scan-runtime/SKILL.md before using runtime queries. Immediately before writing /task/output.json, query both the remaining hunter slots and the active hunter tasks with the scan-runtime skill. Use the returned availableSlots together with each hunter task's title and status to avoid redundant dispatch and decide what to launch next.

        huntTasks is an array of goalPrompt strings. Its length must be exactly the number of hunts you dispatch this turn and must not exceed availableSlots. If availableSlots is 0, set huntTasks to []. You may still emit candidates.

        Begin with a genuinely diverse portfolio. Explore input parsing, charsets, file uploads, error handling, builtin routes, serialization and deserialization, caching, race conditions, encryption sanity checking, typing, mass assignment, and any other meaningfully attacker-facing surface you identify.

        Maintain an explicit registry of approach families under /lane/. Group work by the research idea, not by superficial wording. Keep several incompatible families active at the same time. If many hunts converge on one family, redirect toward underexplored areas. Do not let one approach dominate merely because it seems the most promising or suspicious. When an approach stalls, mark that route blocked with a concrete reason. Reopen it only when someone proposes a materially new mechanism, idea, or construction.

        Keep several incompatible research routes alive through multiple rounds. Cross-pollinate ideas only after independent hunts have developed them far enough to expose their real strengths and gaps.

        Each huntTask string is the Hunter's entire goalPrompt for that slice: the question, scope, evidence standard, and what would count as a useful feedback string. Do not stop at the first grep hit.

        Put the feedback requirements directly into every emitted huntTask goalPrompt so the Hunter knows exactly what to return. Tell the Hunter to return one self-contained feedback string when the assigned slice is complete. Require the feedback to state the slice and methods examined, then give either a confirmed high-impact path, a reason the suspected path is not a vulnerability, or a concrete blocker. For a possible vulnerability, require the entry point, attacker-controlled input, trust-boundary crossing, sink, preconditions, impact, exact file/line/symbol evidence, disproof attempt, and remaining uncertainty. For a negative result, require the relevant paths and sinks checked, the defenses or disproofs that stopped the chain, and meaningful coverage gaps. Feedback is research evidence for the Orchestrator, not a Candidate object or an exploit PoC; do not ask the Hunter to declare the whole repository exhausted.

        Keep Orchestrator notes, coverage decisions, and evidence produced during this task under /lane/. Evaluate the current task input and repository evidence directly; do not collect or merge feedback from other Hunter tasks:

        - A candidate is a complete vulnerability: entry point, trust-boundary crossing, attacker control, sink, preconditions, impact, and a disproof attempt that did not refute it. When the current evidence meets that bar, write one or more Candidate objects that match the candidate schema into candidates and send them to verification.
        - If the current feedback is only a fragment (one primitive, one bypass, one sink, a negative result, or an open question), write the relevant Orchestrator notes under /lane/, set candidates to [], and dispatch huntTasks that fill the missing links. Do not promote a single Hunter string to a candidate just because it sounds severe. Do not emit a speculative candidate.

        These branches are not exclusive across the job. After you return a candidate, keep dispatching huntTasks in the same turn and later turns while hunter slots remain. Sending a candidate to verification is not a reason to stop. Do not mark the research complete because one hunt, one family, one chain, or one accepted candidate finished. Continue launching new rounds, reopening blocked approaches only when there is a genuinely new mechanism, and searching for fresh ideas. You may need to chain intermediate bugs. Stop dispatching and finish the goal only when every high-value slice and credible chain hypothesis is closed. Do not declare global exhaustion only in prose.
      prepareRepository: target
      includePolicy: true
      plugins: []
    outputSchema:
      type: object
      additionalProperties: false
      properties:
        huntTasks:
          type: array
          items:
            type: string
            minLength: 1
        candidates:
          type: array
          items:
            $ref: "#/schemas/candidate"
      required:
        - huntTasks
        - candidates
    inputArtifacts: []
    outputArtifacts: []
    effects:
      - type: sync-candidates
    taskName: Orchestrate hunts
    containerNameParts: []
    allowAgentExit: true
    promptValues: {}
  hunter:
    name: Hunter
    description: One hunt slice. Returns a feedback string. Hunter does not declare exhaustion.
    role: scan
    group: orch-hunt
    concurrency: 8
    maxConcurrency: 8
    disableable: false
    goal: true
    runtime:
      kind: agent
      goalSession: per-task
      persistent: false
      reuseContainer: true
      cwd: /workspace/repo
      skills:
        - codeql
        - semgrep
        - tree-sitter
      prompt: |
        {{goalPrompt}}
      prepareRepository: target
      includePolicy: false
      plugins: []
    outputSchema:
      type: object
      additionalProperties: false
      properties:
        feedback:
          type: string
          minLength: 1
      required:
        - feedback
    inputArtifacts: []
    outputArtifacts: []
    effects: []
    taskName: Hunt
    containerNameParts: []
    allowAgentExit: false
    promptValues:
      goalPrompt: $input.goalPrompt
  verify-finding:
    name: Verify Finding
    description: Fact-check a candidate's paths, claims, and evidence.
    role: verification
    group: review
    concurrency: 1
    disableable: true
    runtime:
      kind: agent
      persistent: false
      reuseContainer: true
      nullableOutput: false
      cwd: /workspace/repo
      skills:
        - verify-finding
      prompt: |
        You are the sanity-check verifier agent for one candidate.
        {{taskIsolation}}
        Work only on this candidate and validate its factual basis.
        scan_job_id: {{scanJobId}}
        candidate_id: {{candidateId}}
        candidate_title: {{candidateTitle}}
        candidate_description: {{candidateDescription}}
        candidate_file: {{candidateFile}}
        candidate_line: {{candidateLine}}
        repository_json_path: {{repositoryJsonPath}}
        candidate_json_path: {{candidateJsonPath}}
        task_dir: {{taskDir}}
        write_verify_report_to: {{reportPath}}

        Use the installed skill named verify-finding as your working method.
        The verify-finding skill file is $VULSEEK_AGENT_HOME/skills/verify-finding/SKILL.md.
        Read the repository and candidate JSON files referenced above before verification.
        Do not repeat broad exploration. This stage is a sanity check only.
        Check whether the candidate's factual claims, code paths, symbols, data-flow descriptions, evidence, and trigger/precondition descriptions really exist or basically hold in the repository.
        Do not judge security impact, exploitability, CVSS, EPSS, whether this is a bug, or whether it should be reported as a vulnerability. Those decisions belong to triage.
        Write a concise markdown sanity-check report to write_verify_report_to.
        Write every task artifact only under task_dir.
        Set id to {{taskId}}.
        Set reportPath to {{reportPath}}.
        Set runtimeSeconds to null if unknown.
        Set status to completed when the run succeeds.
        Set result to the JSON string "true", "likely", or "false".
        Do not return boolean true/false.
        Use result exactly as:
        - "true": core facts, paths, code locations, and trigger conditions are present and materially support the analysis.
        - "likely": most core facts hold, but some uncertainty remains that does not clearly refute the analysis.
        - "false": a central factual claim, code path, trigger, or precondition is absent or contradicted.
      prepareRepository: none
      includePolicy: false
      plugins: []
    outputSchema:
      $ref: "#/schemas/verification"
    inputArtifacts: []
    outputArtifacts: []
    effects:
      - type: project-candidate-result
        resultStage: verify
    report:
      path: /task/01_verify_report.md
      required: true
    taskName: "Candidate Verification: $file($input.candidatePath).title"
    containerNameParts: []
    allowAgentExit: false
    promptValues:
      scanJobId: $ctx.scanJobId
      candidateId: $file($input.candidatePath).id
      candidateTitle: $file($input.candidatePath).title
      candidateDescription: $file($input.candidatePath).description
      candidateFile: $file($input.candidatePath).filePath
      candidateLine: $file($input.candidatePath).line
      repositoryJsonPath: $input.repositoryPath
      candidateJsonPath: $input.candidatePath
      taskDir: $ctx.taskDir
      reportPath: /task/01_verify_report.md
      taskId: $ctx.taskId
  triage-finding:
    name: Triage Finding
    description: Classify the security impact of a verified candidate.
    role: verification
    group: review
    concurrency: 1
    disableable: true
    runtime:
      kind: agent
      persistent: false
      reuseContainer: true
      nullableOutput: false
      cwd: /workspace/repo
      skills:
        - triage-finding
      prompt: |
        You are the triage agent for one verified candidate.
        {{taskIsolation}}
        Work only on this candidate and classify security impact after factual verification passed.
        Use the installed skill named triage-finding as your working method.
        The triage-finding skill file is $VULSEEK_AGENT_HOME/skills/triage-finding/SKILL.md.
        scan_job_id: {{scanJobId}}
        candidate_id: {{candidateId}}
        candidate_title: {{candidateTitle}}
        candidate_description: {{candidateDescription}}
        candidate_file: {{candidateFile}}
        candidate_line: {{candidateLine}}
        verify_result: {{verifyResult}}
        verify_summary: {{verifySummary}}
        repository_json_path: {{repositoryJsonPath}}
        candidate_json_path: {{candidateJsonPath}}
        verify_result_json_path: {{verifyResultJsonPath}}
        task_dir: {{taskDir}}
        write_triage_report_to: {{reportPath}}

        Read the JSON files referenced above before triage.
        Use verify only as a factual sanity-check input. Do not reinterpret verify as a security verdict.
        Classify whether the sanity-checked facts amount to a security issue, non-security bug, hardening finding, or unresolved review item.
        Evaluate disqualifiers before assigning the final security classification. Set disqualifier to null and disqualifierReason to null when no disqualifier applies. If a disqualifier applies, set disqualifierReason to the concrete evidence-based reason.
        - D-0: the vulnerability hypothesis is disproven by code, runtime evidence, or verification facts.
        - D-1: the affected path is only test, mock, example, fixture, sample, benchmark, or dead code.
        - D-1.5: privilege tautology; exploitation already requires the exact privilege or authority that the alleged impact would grant.
        - D-2: required preconditions are unrealistic, contradictory to supported deployments, or require attacker powers outside the threat model.
        - D-3: the claim depends on hedging language or unverifiable speculation that cannot be validated from available evidence.
        - D-4: the behavior has no security impact; it may be a normal bug, robustness issue, or quality issue only.
        - D-5: API misuse or violation of an explicit code/API contract causes the finding; use this for contract errors that should be tracked but are not a confirmed vulnerability by themselves. Do not use D-5 to dismiss a contract violation that produces attacker-controllable security impact.
        When a disqualifier applies, keep result, securityClassification, CVSS, and exploitability consistent with that disqualification.
        Assess CVSS, exploitability, common trigger conditions, and whether this is security impact versus robustness/hardening.
        For EPSS, prefer an official CVE/EPSS mapping when the candidate clearly maps to a CVE. If no CVE maps, provide a heuristic 30-day probability estimate and set epssSource to describe that fallback.
        Write a concise markdown triage report to write_triage_report_to, including the selected disqualifier and disqualifierReason when present.
        Write every task artifact only under task_dir.
        Set id to {{taskId}}.
        Set reportPath to {{reportPath}}.
        Set runtimeSeconds to null if unknown.
        Set status to completed when the run succeeds.
      prepareRepository: none
      includePolicy: false
      plugins: []
    outputSchema:
      $ref: "#/schemas/triage"
    inputArtifacts: []
    outputArtifacts: []
    effects:
      - type: project-candidate-result
        resultStage: triage
    report:
      path: /task/01_triage_report.md
      required: true
    taskName: "Candidate Triage: $file($input.candidatePath).title"
    containerNameParts: []
    allowAgentExit: false
    promptValues:
      scanJobId: $ctx.scanJobId
      candidateId: $file($input.candidatePath).id
      candidateTitle: $file($input.candidatePath).title
      candidateDescription: $file($input.candidatePath).description
      candidateFile: $file($input.candidatePath).filePath
      candidateLine: $file($input.candidatePath).line
      verifyResult: $file($input.verifyResultPath).result
      verifySummary: $file($input.verifyResultPath).summary
      repositoryJsonPath: $input.repositoryPath
      candidateJsonPath: $input.candidatePath
      verifyResultJsonPath: $input.verifyResultPath
      taskDir: $ctx.taskDir
      reportPath: /task/01_triage_report.md
      taskId: $ctx.taskId
edges:
  - id: orchestrator-to-hunter
    name: orchestrator-to-hunter
    from: orchestrator
    to: hunter
    fork: false
    mode: fanOut
    foreach: $.huntTasks[*]
    input:
      goalPrompt: $item
    artifacts:
      - from: $input.repositoryPath
        to: inputs/repository.json
        inputField: repositoryPath
        required: true
  - id: orchestrator-to-verify-finding
    name: orchestrator-to-verify-finding
    from: orchestrator
    to: verify-finding
    fork: false
    mode: fanOut
    foreach: $.candidates[*]
    input:
      candidate: $item
      candidatePath: ""
    artifacts:
      - from: $input.repositoryPath
        to: inputs/repository.json
        inputField: repositoryPath
        required: true
      - from: $input.candidate
        to: inputs/candidate.json
        inputField: candidatePath
        required: true
  - id: hunter-to-orchestrator
    name: hunter-to-orchestrator
    from: hunter
    to: orchestrator
    fork: false
    mode: map
    input:
      feedback: $output.feedback
    artifacts:
      - from: $input.repositoryPath
        to: inputs/repository.json
        inputField: repositoryPath
        required: true
  - id: verify-finding-to-triage-finding
    name: verify-finding-to-triage-finding
    from: verify-finding
    to: triage-finding
    fork: false
    mode: map
    input:
      candidatePath: $input.candidatePath
      verifyResultPath: ""
    artifacts:
      - from: $input.repositoryPath
        to: inputs/repository.json
        inputField: repositoryPath
        required: true
      - from: $input.candidatePath
        to: inputs/candidate.json
        inputField: candidatePath
        required: true
      - from: $output
        to: inputs/verification.json
        inputField: verifyResultPath
        required: true
    outputSchema:
      $ref: "#/schemas/verification"
groups: []
