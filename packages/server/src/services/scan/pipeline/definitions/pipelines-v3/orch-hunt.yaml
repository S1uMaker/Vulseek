version: 3
name: orchestrator-hunt-programmatic
supportedTargets:
  - project
  - evaluation
root: orchestrator
limits:
  maxTasks: 10000
  maxDurationSeconds: 86400
presentation:
  jobTabs:
    - id: candidates
      label: Candidates
      renderer: candidate-results
      dataSource: vulnerability-candidates
      columns:
        - title
        - filePath
        - analysisResult
        - verificationResult
        - triageResult
        - score
        - createdAt
      filters:
        - analysisResult
        - verificationResult
        - triageResult
      defaultSort:
        field: createdAt
        direction: desc
      detail: vulnerability-candidate
    - id: ledger
      label: Ledger
      renderer: entity-table
      dataSource: ledger-primitives
      columns:
        - id
        - title
        - type
        - state
        - verdict
        - primitiveCount
        - file
        - line
        - revision
        - updatedAt
      filters:
        - type
        - state
        - verdict
      defaultSort:
        field: updatedAt
        direction: desc
      detail: ledger-primitive
schemas:
  evidence:
    type: object
    required:
      - id
      - kind
      - summary
      - filePath
      - line
      - symbol
      - command
      - artifactPath
      - observation
      - supports
      - contradicts
      - confidenceImpact
    additionalProperties: false
    properties:
      id:
        type: string
      kind:
        enum: [code, runtime, fuzz, negative, assumption, external]
      summary:
        type: string
      filePath:
        type: [string, "null"]
      line:
        type: [integer, "null"]
      symbol:
        type: [string, "null"]
      command:
        type: [string, "null"]
      artifactPath:
        type: [string, "null"]
      observation:
        type: [string, "null"]
      supports:
        type: array
        items:
          type: string
      contradicts:
        type: array
        items:
          type: string
      confidenceImpact:
        type: [string, "null"]
  repository:
    type: object
    required:
      - id
      - name
      - summary
      - languages
      - buildSystems
      - runtimeDirectories
      - downrankedDirectories
      - notes
      - targetRef
      - targetTag
      - commitSha
      - baseSha
      - commitWindow
    properties:
      id:
        type: string
      name:
        type: string
      summary:
        type: string
      languages:
        type: array
        items:
          type: string
      buildSystems:
        type: array
        items:
          type: string
      runtimeDirectories:
        type: array
        items:
          type: string
      downrankedDirectories:
        type: array
        items:
          type: string
      notes:
        type: array
        items:
          type: string
      targetRef:
        type: [string, "null"]
      targetTag:
        type: [string, "null"]
      commitSha:
        type: [string, "null"]
      baseSha:
        type: [string, "null"]
      commitWindow:
        type: integer
  target-kind:
    enum:
      - function
      - route-handler
      - middleware
      - api-route
      - server-action
      - page-loader
      - controller-action
      - view-function
      - resolver
      - job-handler
      - cli-command
      - security-config
      - template-render
      - parser-deserializer
      - data-access
      - unknown
  candidate:
    type: object
    required:
      - id
      - functionId
      - title
      - description
      - filePath
      - line
      - vulnerabilityType
      - confidence
      - score
      - claim
      - rootCauseKey
      - evidence
      - attackerControl
      - affectedSink
      - preconditions
      - quickDisproofAttempt
      - needsFuzzing
      - needsManualAnalysis
    properties:
      id:
        type: string
        description: Assigned by submit_candidate as candidate-<6 hex>. Do not set this in the agent payload.
      functionId:
        type: [string, "null"]
      title:
        type: string
      description:
        type: string
      filePath:
        type: [string, "null"]
      line:
        type: [integer, "null"]
      vulnerabilityType:
        type: [string, "null"]
      confidence:
        type: [number, "null"]
      score:
        type: [number, "null"]
      claim:
        type: string
      rootCauseKey:
        type: [string, "null"]
      targetId:
        type: [string, "null"]
      targetKind:
        anyOf:
          - $ref: "#/schemas/target-kind"
          - type: "null"
      evidence:
        type: array
        items:
          $ref: "#/schemas/evidence"
      attackerControl:
        type: [string, "null"]
      affectedSink:
        type: [string, "null"]
      preconditions:
        type: array
        items:
          type: string
      quickDisproofAttempt:
        type: [string, "null"]
      needsFuzzing:
        type: boolean
      needsManualAnalysis:
        type: boolean
  verification:
    type: object
    required:
      - id
      - result
      - summary
      - confidence
      - score
      - reportPath
      - runtimeSeconds
      - evidenceBundle
      - residualUncertainty
    properties:
      id:
        type: string
      result:
        enum: ["true", likely, "false"]
      summary:
        type: string
      confidence:
        type: [number, "null"]
      score:
        type: [number, "null"]
      reportPath:
        type: [string, "null"]
      runtimeSeconds:
        type: [number, "null"]
      evidenceBundle:
        type: array
        items:
          $ref: "#/schemas/evidence"
      residualUncertainty:
        type: array
        items:
          type: string
  triage:
    type: object
    required:
      - id
      - result
      - disqualifier
      - disqualifierReason
      - securityClassification
      - isSecurityIssue
      - impactType
      - cvssVector
      - cvssScore
      - cvssSeverity
      - exploitability
      - isExploitable
      - commonTriggerConditions
      - hardeningOrRobustness
      - epssProbability30d
      - epssSource
      - summary
      - reportPath
      - runtimeSeconds
      - evidenceBundle
      - residualUncertainty
    properties:
      id:
        type: string
      result:
        enum: [security_issue, non_security, hardening, needs_review]
      disqualifier:
        enum:
          - D-0
          - D-1
          - D-1.5
          - D-2
          - D-3
          - D-4
          - D-5
          - null
      disqualifierReason:
        type: [string, "null"]
      securityClassification:
        enum: [vulnerability, security_hardening, robustness, non_security, unknown]
      isSecurityIssue:
        type: boolean
      impactType:
        type: string
      cvssVector:
        type: [string, "null"]
      cvssScore:
        type: [number, "null"]
        minimum: 0
        maximum: 10
      cvssSeverity:
        enum: [none, low, medium, high, critical, unknown]
      exploitability:
        enum: [none, theoretical, proof_of_concept, practical, unknown]
      isExploitable:
        type: [boolean, "null"]
      commonTriggerConditions:
        type: array
        items:
          type: string
      hardeningOrRobustness:
        type: boolean
      epssProbability30d:
        type: [number, "null"]
        minimum: 0
        maximum: 1
      epssSource:
        type: string
      summary:
        type: string
      reportPath:
        type: [string, "null"]
      runtimeSeconds:
        type: [number, "null"]
      evidenceBundle:
        type: array
        items:
          $ref: "#/schemas/evidence"
      residualUncertainty:
        type: array
        items:
          type: string
  hunt-task:
    type: object
    additionalProperties: false
    required:
      - name
      - goalPrompt
    properties:
      name:
        type: string
        minLength: 1
        pattern: "^#[1-9][0-9]* .+"
        description: >-
          Job-global hunt id assigned by the Orchestrator. Must start with a
          monotonically increasing #<n> prefix and a space, then a short slug
          (example: "#1 rest-authz-boundary"). n starts at 1 for the first hunt
          in the job and increases by 1 for every later huntTasks item across
          all turns. Never skip, reuse, or renumber. Hunter must echo this
          string exactly.
      goalPrompt:
        type: string
        minLength: 1
        description: >-
          Research ask written by the Orchestrator. For a function task,
          include its exact code location; for a chain task, include the chain
          Ledger entry, every material function and location, and the required
          point-to-line analysis. For a Ledger follow-up, cite relevant entries
          and gaps. Do not prefix with /goal or write the Hunter submit footer.
stages:
  orchestrator:
    name: Orchestrator
    description: >-
      Use reconnaissance-level code reading and the Ledger to choose neutral
      function or call-chain scopes, dispatch Hunter tasks, compose chains,
      and submit candidates only when an unauthenticated or pre-auth
      high-severity chain of primitives is complete.
    role: scan
    group: orch-hunt
    concurrency: 1
    maxConcurrency: 1
    disableable: false
    goal: true
    goalPreserving: true
    runtime:
      kind: agent
      goalSession: shared
      persistent: true
      reuseContainer: true
      nullableOutput: false
      cwd: /workspace/repo
      inputDelivery: poll
      messageNotification: true
      skills:
        - orch-hunt-ppl
      mcp:
        - securitycontext
      outputSuffix: omit
      pollPrompt: |
        On each notify, take get_critic_feedback once and read the critic review. Incomplete reviews and refused verification are redispatched; a Hunter covered row is not coverage until the critic marks it verified. Use a bounded frontier pass for undispatched rows, concrete partial gaps, and selected file/function/title matches. An active Hunter owns only its stated goalPrompt scope. Combine justified gaps with new code directions, prepare the complete eligible batch, and use one spawn_hunters call.
      prompt: |
        You are the Orchestrator for a high-severity vulnerability research scan. You dispatch Hunters; you are not a Hunter. Follow $VULSEEK_AGENT_HOME/skills/orch-hunt-ppl/orchestrator.md for coverage, Ledger use, goalPrompt construction, and dispatch. Ledger CLI and fields: $VULSEEK_AGENT_HOME/skills/orch-hunt-ppl/hunt-ledger.md. Variant and patch heuristics: $VULSEEK_AGENT_HOME/skills/orch-hunt-ppl/variant-analysis/SKILL.md and $VULSEEK_AGENT_HOME/skills/orch-hunt-ppl/post-patch-validation/SKILL.md.

        Expand coverage from individual functions to call chains. Read code at reconnaissance level to identify entry points, handlers, material functions, and control, data, or authority relationships. Query the Ledger by exact functionName, file, and title, then inspect statements, locations, evidence, gaps, and links. A code-grounded chain may be dispatched before independent function hunts; independent function hunts are not a prerequisite; create or reuse one neutral chain Ledger proposition. A chain mention, title, or covered row never proves local function coverage.

        Write every Hunter goalPrompt as a neutral, code-grounded investigation brief. Keep it concise and scope-oriented. For a function task, name the exact file and function, then require a complete review with the necessary surrounding context. For a chain task, describe only the ordered code-grounded steps and their observed control, data, authority, or reachability relationships; do not enumerate the implementing functions or prescribe a vulnerability direction—the Hunter must locate the implementations in the current source tree. For a Ledger follow-up, cite the chain entryId and summarize the steps to reconstruct or verify; do not copy prior function mappings, detailed hypotheses, or detailed Ledger contents. Keep detailed analysis methods in the Hunter skill. Keep each goalPrompt at or below 4,000 characters, targeting 3,900 or fewer.

        On every decision, take feedback once when available and read all cited Ledger rows. Inspect undispatched discovered/untracked rows, partial rows with concrete gaps, and selected file/function/title matches without repeatedly dumping covered rows. An active Hunter owns only its stated scope. Read local code before spawning when no undispatched row exists, regardless of available slots; use variant-analysis and post-patch-validation as search heuristics.

        Prepare as many independent, code-grounded function or chain briefs as available slots justify. Hunters create and update function and chain Ledger propositions: record exact paths in evidence or gaps, keep the Ledger flat, and do not create function placeholders or rows for routine pass-throughs. Dispatch the complete batch in a single spawn_hunters call; do not serialize valid work, duplicate active scope, or invent filler. Require direct, path-specific code evidence.

        Continue from critic feedback, Ledger gaps, and new code directions. Hunter output does not return here directly. An empty queue, a Hunter covered row, a safe example, or no qualifying candidate does not prove coverage. Call update_goal({status: "complete"}) only after no Hunter or critic task is in flight and the skill's completion audit finds no undispatched work, actionable gap, or missing local/connection analysis.

        Use submit_candidate only when an original high-severity unauthenticated or pre-authentication chain is supported from entry through primitives to sink and impact. A single sink or gate is insufficient. Do not write exploit PoCs or run a full admin-create / write-file exploit chain.
      prepareRepository: target
      includePolicy: true
      plugins: []
    outputSchema:
      type: object
      additionalProperties: false
      properties:
        huntTasks:
          type: array
          items:
            $ref: "#/schemas/hunt-task"
        candidates:
          type: array
          items:
            $ref: "#/schemas/candidate"
      required:
        - huntTasks
        - candidates
    inputArtifacts: []
    outputArtifacts: []
    effects:
      - type: sync-candidates
    taskName: Orchestrate hunts
    containerNameParts: []
    allowAgentExit: true
    promptValues: {}
  hunter:
    name: Hunter
    description: >-
      Analyze an assigned function or Ledger call-chain gap from all relevant
      security angles and report the research result. Returns name + feedback.
      Hunter does not submit candidates or declare exhaustion.
    role: scan
    group: orch-hunt
    concurrency: 8
    maxConcurrency: 8
    disableable: false
    goal: true
    runtime:
      kind: agent
      goalSession: per-task
      persistent: false
      reuseContainer: true
      cwd: /workspace/repo
      inputDelivery: prompt
      outputSuffix: omit
      skills:
        - orch-hunt-ppl
        - scan-runtime
        - codeql
        - semgrep
        - tree-sitter
      mcp:
        - securitycontext
      prompt: |
        {{goalPrompt}}

        Follow $VULSEEK_AGENT_HOME/skills/orch-hunt-ppl/hunter.md.
        Ledger: $VULSEEK_AGENT_HOME/skills/orch-hunt-ppl/hunt-ledger.md.
        Do not set function state to verified. Your only handoff is submit-message. Do not wait for the critic or any downstream result.
        The goalPrompt is a route. Record every function you analyze as its own Ledger row. Do not put that function into another row's locations or evidence.
      prepareRepository: target
      includePolicy: false
      plugins: []
    outputSchema:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          pattern: "^#[1-9][0-9]* .+"
          description: >-
            Exact hunt id assigned by the Orchestrator, including the job-global
            #<n> prefix (example: "#1 rest-authz-boundary"). Do not invent or
            rewrite this string.
        feedback:
          type: string
          minLength: 1
          description: >-
            Research result as a string. Summarize material findings and
            unresolved questions as useful; no fixed feedback format is
            required. Do not declare exhaustion.
      required:
        - name
        - feedback
    inputArtifacts: []
    outputArtifacts: []
    effects: []
    taskName: $input.name
    containerNameParts: []
    allowAgentExit: false
    promptValues:
      name: $input.name
      goalPrompt: $input.goalPrompt
  critic:
    name: Critic
    description: >-
      Review one Hunter result against its goalPrompt and the Ledger rows it
      changed. Mark a covered function verified only when the work is complete
      and the primitives are correct. Submit the review to the Orchestrator
      with submit-message.
    role: scan
    group: orch-hunt
    concurrency: 8
    maxConcurrency: 8
    disableable: false
    goal: false
    runtime:
      kind: agent
      persistent: false
      reuseContainer: true
      cwd: /workspace/repo
      inputDelivery: prompt
      outputSuffix: omit
      skills:
        - orch-hunt-ppl
        - scan-runtime
      prompt: |
        Review hunt {{name}}.
        goalPrompt:
        {{goalPrompt}}
        hunterFeedback:
        {{feedback}}

        Follow $VULSEEK_AGENT_HOME/skills/orch-hunt-ppl/critic.md.
        Ledger: $VULSEEK_AGENT_HOME/skills/orch-hunt-ppl/hunt-ledger.md.
        Your only handoff is submit-message. A chat reply is not a submission.
        A function that appears only as locations or evidence on another row, and has no row of its own, is incomplete.
      prepareRepository: target
      includePolicy: false
      plugins: []
    outputSchema:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        completeness:
          type: string
          enum: [complete, incomplete]
        feedback:
          type: string
          minLength: 1
        verifiedFunctionIds:
          type: array
          items:
            type: integer
            minimum: 1
      required:
        - name
        - completeness
        - feedback
        - verifiedFunctionIds
    inputArtifacts: []
    outputArtifacts: []
    effects: []
    taskName: "Critic: $input.name"
    containerNameParts: []
    allowAgentExit: false
    promptValues:
      name: $input.name
      goalPrompt: $input.goalPrompt
      feedback: $input.feedback
  verify-finding:
    name: Verify Finding
    description: Fact-check a candidate's paths, claims, and evidence.
    role: verification
    group: review
    concurrency: 1
    disableable: true
    runtime:
      kind: agent
      persistent: false
      reuseContainer: true
      nullableOutput: false
      cwd: /workspace/repo
      skills:
        - verify-finding
      prompt: |
        You are the sanity-check verifier agent for one candidate.
        {{taskIsolation}}
        Work only on this candidate and validate its factual basis.
        scan_job_id: {{scanJobId}}
        candidate_id: {{candidateId}}
        candidate_title: {{candidateTitle}}
        candidate_description: {{candidateDescription}}
        candidate_file: {{candidateFile}}
        candidate_line: {{candidateLine}}
        repository_json_path: {{repositoryJsonPath}}
        candidate_json_path: {{candidateJsonPath}}
        task_dir: {{taskDir}}
        write_verify_report_to: {{reportPath}}

        Use the installed skill named verify-finding as your working method.
        The verify-finding skill file is $VULSEEK_AGENT_HOME/skills/verify-finding/SKILL.md.
        Read the repository and candidate JSON files referenced above before verification.
        Do not repeat broad exploration. This stage is a sanity check only.
        Check whether the candidate's factual claims, code paths, symbols, data-flow descriptions, evidence, and trigger/precondition descriptions really exist or basically hold in the repository.
        Do not judge security impact, exploitability, CVSS, EPSS, whether this is a bug, or whether it should be reported as a vulnerability. Those decisions belong to triage.
        Write a concise markdown sanity-check report to write_verify_report_to.
        Write every task artifact only under task_dir.
        Set id to {{taskId}}.
        Set reportPath to {{reportPath}}.
        Set runtimeSeconds to null if unknown.
        Set status to completed when the run succeeds.
        Set result to the JSON string "true", "likely", or "false".
        Do not return boolean true/false.
        Use result exactly as:
        - "true": core facts, paths, code locations, and trigger conditions are present and materially support the analysis.
        - "likely": most core facts hold, but some uncertainty remains that does not clearly refute the analysis.
        - "false": a central factual claim, code path, trigger, or precondition is absent or contradicted.
      prepareRepository: none
      includePolicy: false
      plugins: []
    outputSchema:
      $ref: "#/schemas/verification"
    inputArtifacts: []
    outputArtifacts: []
    effects:
      - type: project-candidate-result
        resultStage: verify
    report:
      path: /task/01_verify_report.md
      required: true
    taskName: "Candidate Verification: $input.candidate.title"
    containerNameParts: []
    allowAgentExit: false
    promptValues:
      scanJobId: $ctx.scanJobId
      candidateId: $input.candidate.id
      candidateTitle: $input.candidate.title
      candidateDescription: $input.candidate.description
      candidateFile: $input.candidate.filePath
      candidateLine: $input.candidate.line
      repositoryJsonPath: /task/inputs/repository.json
      candidateJsonPath: /task/inputs/candidate.json
      taskDir: $ctx.taskDir
      reportPath: /task/01_verify_report.md
      taskId: $ctx.taskId
  triage-finding:
    name: Triage Finding
    description: Classify the security impact of a verified candidate.
    role: verification
    group: review
    concurrency: 1
    disableable: true
    runtime:
      kind: agent
      persistent: false
      reuseContainer: true
      nullableOutput: false
      cwd: /workspace/repo
      skills:
        - triage-finding
      prompt: |
        You are the triage agent for one verified candidate.
        {{taskIsolation}}
        Work only on this candidate and classify security impact after factual verification passed.
        Use the installed skill named triage-finding as your working method.
        The triage-finding skill file is $VULSEEK_AGENT_HOME/skills/triage-finding/SKILL.md.
        scan_job_id: {{scanJobId}}
        candidate_id: {{candidateId}}
        candidate_title: {{candidateTitle}}
        candidate_description: {{candidateDescription}}
        candidate_file: {{candidateFile}}
        candidate_line: {{candidateLine}}
        verify_result: {{verifyResult}}
        verify_summary: {{verifySummary}}
        repository_json_path: {{repositoryJsonPath}}
        candidate_json_path: {{candidateJsonPath}}
        verify_result_json_path: {{verifyResultJsonPath}}
        task_dir: {{taskDir}}
        write_triage_report_to: {{reportPath}}

        Read the JSON files referenced above before triage.
        Use verify only as a factual sanity-check input. Do not reinterpret verify as a security verdict.
        Classify whether the sanity-checked facts amount to a security issue, non-security bug, hardening finding, or unresolved review item.
        Evaluate disqualifiers before assigning the final security classification. Set disqualifier to null and disqualifierReason to null when no disqualifier applies. If a disqualifier applies, set disqualifierReason to the concrete evidence-based reason.
        - D-0: the vulnerability hypothesis is disproven by code, runtime evidence, or verification facts.
        - D-1: the affected path is only test, mock, example, fixture, sample, benchmark, or dead code.
        - D-1.5: privilege tautology; exploitation already requires the exact privilege or authority that the alleged impact would grant.
        - D-2: required preconditions are unrealistic, contradictory to supported deployments, or require attacker powers outside the threat model.
        - D-3: the claim depends on hedging language or unverifiable speculation that cannot be validated from available evidence.
        - D-4: the behavior has no security impact; it may be a normal bug, robustness issue, or quality issue only.
        - D-5: API misuse or violation of an explicit code/API contract causes the finding; use this for contract errors that should be tracked but are not a confirmed vulnerability by themselves. Do not use D-5 to dismiss a contract violation that produces attacker-controllable security impact.
        When a disqualifier applies, keep result, securityClassification, CVSS, and exploitability consistent with that disqualification.
        Assess CVSS, exploitability, common trigger conditions, and whether this is security impact versus robustness/hardening.
        For EPSS, prefer an official CVE/EPSS mapping when the candidate clearly maps to a CVE. If no CVE maps, provide a heuristic 30-day probability estimate and set epssSource to describe that fallback.
        Write a concise markdown triage report to write_triage_report_to, including the selected disqualifier and disqualifierReason when present.
        Write every task artifact only under task_dir.
        Set id to {{taskId}}.
        Set reportPath to {{reportPath}}.
        Set runtimeSeconds to null if unknown.
        Set status to completed when the run succeeds.
      prepareRepository: none
      includePolicy: false
      plugins: []
    outputSchema:
      $ref: "#/schemas/triage"
    inputArtifacts: []
    outputArtifacts: []
    effects:
      - type: project-candidate-result
        resultStage: triage
    report:
      path: /task/01_triage_report.md
      required: true
    taskName: "Candidate Triage: $input.candidate.title"
    containerNameParts: []
    allowAgentExit: false
    promptValues:
      scanJobId: $ctx.scanJobId
      candidateId: $input.candidate.id
      candidateTitle: $input.candidate.title
      candidateDescription: $input.candidate.description
      candidateFile: $input.candidate.filePath
      candidateLine: $input.candidate.line
      verifyResult: $file($input.verifyResultPath).result
      verifySummary: $file($input.verifyResultPath).summary
      repositoryJsonPath: /task/inputs/repository.json
      candidateJsonPath: /task/inputs/candidate.json
      verifyResultJsonPath: $input.verifyResultPath
      taskDir: $ctx.taskDir
      reportPath: /task/01_triage_report.md
      taskId: $ctx.taskId
edges:
  - id: orchestrator-to-hunter
    name: orchestrator-to-hunter
    from: orchestrator
    to: hunter
    fork: false
    mode: fanOut
    foreach: $.huntTasks[*]
    input:
      name: $item.name
      goalPrompt: $item.goalPrompt
  - id: hunter-to-critic
    name: hunter-to-critic
    from: hunter
    to: critic
    fork: false
    mode: map
    input:
      name: $output.name
      goalPrompt: $input.goalPrompt
      feedback: $output.feedback
  - id: critic-to-orchestrator
    name: critic-to-orchestrator
    from: critic
    to: orchestrator
    fork: false
    mode: map
    input:
      name: $output.name
      feedback: $output.feedback
      completeness: $output.completeness
      verifiedFunctionIds: $output.verifiedFunctionIds
  - id: orchestrator-to-verify-finding
    name: orchestrator-to-verify-finding
    from: orchestrator
    to: verify-finding
    fork: false
    mode: fanOut
    foreach: $.candidates[*]
    input:
      candidate: $item
      repositoryPath: $input.repositoryPath
    artifacts:
      - from: $input.repositoryPath
        to: inputs/repository.json
        required: true
      - from: $input.candidate
        to: inputs/candidate.json
        required: true
  - id: verify-finding-to-triage-finding
    name: verify-finding-to-triage-finding
    from: verify-finding
    to: triage-finding
    fork: false
    mode: map
    input:
      candidate: $input.candidate
      repositoryPath: $input.repositoryPath
      verifyResultPath: /task/inputs/verification.json
    artifacts:
      - from: $input.repositoryPath
        to: inputs/repository.json
        required: true
      - from: $input.candidate
        to: inputs/candidate.json
        required: true
      - from: $output
        to: inputs/verification.json
        required: true
    outputSchema:
      $ref: "#/schemas/verification"
groups: []
