tob-goal:
  name: tob-goal-programmatic
  root: goal-craft
  stages:
    - goal-craft
    - goal-surface
    - goal-hunt
    - goal-judge
    - goal-dedup
  edges:
    - name: goal-craft-to-goal-surface
      from: goal-craft
      to: goal-surface
      mode: map
      input:
        goalSpecPath: "$output.goalSpecPath"
        feedback: null
      artifacts:
        - from: "$output.goalSpecPath"
          to: inputs/goal-spec.json
          inputField: goalSpecPath

    # Single outbound edge from goal-surface — no route key (envelope route: null),
    # matching full/delta non-branching edges.
    - name: goal-surface-to-goal-hunt
      from: goal-surface
      to: goal-hunt
      mode: fanOut
      foreach: "$.huntGoals[*]"
      input:
        goalSpecPath: "$input.goalSpecPath"
        goalPrompt: "$item.goalPrompt"
        repositoryPath: "$input.repositoryPath"
        huntGoal: "$item"
      artifacts:
        - from: "$input.goalSpecPath"
          to: inputs/goal-spec.json
          inputField: goalSpecPath

    - name: goal-hunt-to-goal-judge
      from: goal-hunt
      to: goal-judge
      mode: map
      route:
        key: candidate
        default: true
      input:
        goalSpecPath: "$input.goalSpecPath"
        goalPrompt: "$input.goalPrompt"
        huntGoal: "$input.huntGoal"
        candidate: "$output.candidate"
      artifacts:
        - from: "$input.goalSpecPath"
          to: inputs/goal-spec.json
          inputField: goalSpecPath

    - name: goal-judge-to-goal-dedup
      from: goal-judge
      to: goal-dedup
      mode: map
      route:
        key: confirmed
      input:
        goalSpecPath: "$input.goalSpecPath"
        goalPrompt: "$input.goalPrompt"
        huntGoal: "$input.huntGoal"
        candidate: "$input.candidate"
        judge: "$output"
      artifacts:
        - from: "$input.goalSpecPath"
          to: inputs/goal-spec.json
          inputField: goalSpecPath

    - name: goal-judge-reject-to-goal-surface
      from: goal-judge
      to: goal-surface
      mode: map
      route:
        key: rejected
        default: true
      input:
        goalSpecPath: "$input.goalSpecPath"
        repositoryPath: "$input.repositoryPath"
        feedback:
          kind: judge-reject
          huntGoalId: "$input.huntGoal.huntGoalId"
          candidateId: "$input.candidate.candidateId"
          summary: "$output.summary"
          payload:
            huntGoalTitle: "$input.huntGoal.title"
            scopeStatement: "$input.huntGoal.scopeStatement"
            focusPaths: "$input.huntGoal.focusPaths"
            judgeDecision: "$output.decision"
            judgeReasons: "$output.reasons"
            rootCauseKey: "$input.candidate.rootCauseKey"
      artifacts:
        - from: "$input.goalSpecPath"
          to: inputs/goal-spec.json
          inputField: goalSpecPath

    - name: goal-dedup-novel-to-goal-surface
      from: goal-dedup
      to: goal-surface
      mode: map
      route:
        key: novel
      input:
        goalSpecPath: "$input.goalSpecPath"
        repositoryPath: "$input.repositoryPath"
        feedback:
          kind: dedup-novel
          huntGoalId: "$input.huntGoal.huntGoalId"
          candidateId: "$input.candidate.candidateId"
          summary: "$output.summary"
          payload:
            huntGoalTitle: "$input.huntGoal.title"
            scopeStatement: "$input.huntGoal.scopeStatement"
            focusPaths: "$input.huntGoal.focusPaths"
            judgeDecision: "$input.judge.decision"
            judgeReasons: "$input.judge.reasons"
            rootCauseKey: "$input.candidate.rootCauseKey"
      artifacts:
        - from: "$input.goalSpecPath"
          to: inputs/goal-spec.json
          inputField: goalSpecPath

    - name: goal-dedup-reject-to-goal-surface
      from: goal-dedup
      to: goal-surface
      mode: map
      route:
        key: reject
        default: true
      input:
        goalSpecPath: "$input.goalSpecPath"
        repositoryPath: "$input.repositoryPath"
        feedback:
          kind: dedup-reject
          huntGoalId: "$input.huntGoal.huntGoalId"
          candidateId: "$input.candidate.candidateId"
          summary: "$output.summary"
          payload:
            huntGoalTitle: "$input.huntGoal.title"
            scopeStatement: "$input.huntGoal.scopeStatement"
            focusPaths: "$input.huntGoal.focusPaths"
            judgeDecision: "$input.judge.decision"
            judgeReasons: "$input.judge.reasons"
            rootCauseKey: "$input.candidate.rootCauseKey"
      artifacts:
        - from: "$input.goalSpecPath"
          to: inputs/goal-spec.json
          inputField: goalSpecPath
